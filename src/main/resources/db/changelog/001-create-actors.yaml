databaseChangeLog:
    - changeSet:
          id: 001-create-actors
          author: lbusch
          changes:
              - createTable:
                    tableName: actors
                    columns:
                        - column:
                              name: id
                              type: uuid
                              defaultValueComputed: uuidv7()
                              constraints:
                                  primaryKey: true
                                  nullable: false
                        - column:
                              name: actor_id
                              type: bigint
                              constraints:
                                  nullable: false
                                  unique: true
                        - column:
                              name: url
                              type: varchar(255)
                              constraints:
                                  nullable: false
                        - column:
                              name: login
                              type: varchar(255)
                              constraints:
                                  nullable: false
                        - column:
                              name: avatar_url
                              type: varchar(255)
                              constraints:
                                  nullable: false
                        - column:
                              name: gravatar_id
                              type: varchar(255)
                        - column:
                              name: display_login
                              type: varchar(255)
